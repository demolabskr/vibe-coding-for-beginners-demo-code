<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공부 노트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <style>
    .narrow { max-width: 420px; margin: 24px auto; }
    .error { color: #b3261e; }
    mark { font-size: 0.8rem; }
    .report { white-space: pre-wrap; }
  </style>
</head>
<body>
  <nav class="container">
    <ul><li><strong>공부 노트</strong></li></ul>
    {% if user.is_authenticated %}
    <ul>
      <li><a href="{% url 'note_list' %}">노트</a></li>
      <li><a href="{% url 'review' %}">틀린 문제</a></li>
      <li><form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="outline" style="padding:4px 10px">로그아웃</button></form></li>
    </ul>
    {% endif %}
  </nav>
  <main class="container">
    {% for message in messages %}<p><mark>{{ message }}</mark></p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
