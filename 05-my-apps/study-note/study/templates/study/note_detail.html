{% extends "base.html" %}
{% block content %}
<p><a href="{% url 'note_list' %}">← 노트 목록</a></p>
<h1>[{{ note.subject }}] {{ note.title }}</h1>
<article class="report">{{ note.body }}</article>
<form method="post" action="{% url 'make_quiz' note.pk %}">
  {% csrf_token %}
  <button type="submit" onclick="this.setAttribute('aria-busy','true'); this.textContent='문제를 만드는 중입니다. 30초쯤 걸릴 수 있습니다.';">
    {% if note.quizzes.exists %}문제 다시 만들기{% else %}AI로 복습 퀴즈 만들기{% endif %}
  </button>
</form>
{% if note.quizzes.exists %}<p><a href="{% url 'solve' note.pk %}">만든 문제 {{ note.quizzes.count }}개 풀기 →</a></p>{% endif %}
{% endblock %}
